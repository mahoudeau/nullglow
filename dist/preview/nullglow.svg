  <text xml:space="preserve" x="30" y="109"><tspan fill="#ff4d9e">const</tspan><tspan fill="#cfd8d3"> port </tspan><tspan fill="#8f9c96">= </tspan><tspan fill="#cfd8d3">process</tspan><tspan fill="#8f9c96">.</tspan><tspan fill="#48b8f5">env</tspan><tspan fill="#8f9c96">.</tspan><tspan fill="#48b8f5">PORT</tspan><tspan fill="#8f9c96"> ?? </tspan><tspan fill="#d79bff">3000</tspan><tspan fill="#8f9c96">;</tspan></text>
