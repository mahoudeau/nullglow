  <text xml:space="preserve" x="30" y="151"><tspan fill="#8f9c96">  ['</tspan><tspan fill="#f5d76b">/api/jobs</tspan><tspan fill="#8f9c96">', </tspan><tspan fill="#2bf59b">listJobs</tspan><tspan fill="#8f9c96">],</tspan></text>
  <text xml:space="preserve" x="30" y="172"><tspan fill="#8f9c96">]);</tspan></text>
  <text xml:space="preserve" x="30" y="214"><tspan fill="#ff4d9e">export</tspan><tspan fill="#8f9c96"> </tspan><tspan fill="#ff4d9e">async</tspan><tspan fill="#8f9c96"> </tspan><tspan fill="#ff4d9e">function</tspan><tspan fill="#8f9c96"> </tspan><tspan fill="#2bf59b">start</tspan><tspan fill="#8f9c96">(</tspan><tspan fill="#cfd8d3">opts</tspan><tspan fill="#8f9c96"> = {}) {</tspan></text>
  <text xml:space="preserve" x="30" y="235"><tspan fill="#8f9c96">  </tspan><tspan fill="#ff4d9e">return</tspan><tspan fill="#8f9c96"> </tspan><tspan fill="#2bf59b">createServer</tspan><tspan fill="#8f9c96">(</tspan><tspan fill="#cfd8d3">handler</tspan><tspan fill="#8f9c96">).</tspan><tspan fill="#2bf59b">listen</tspan><tspan fill="#8f9c96">(</tspan><tspan fill="#cfd8d3">port</tspan><tspan fill="#8f9c96">);</tspan></text>
