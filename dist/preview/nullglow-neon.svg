  <text xml:space="preserve" x="30" y="46"><tspan fill="#6e7d71">// Bind late so PORT can come from the environment.</tspan></text>
  <text xml:space="preserve" x="30" y="67"><tspan fill="#f81578">import</tspan><tspan fill="#8f9c96"> { </tspan><tspan fill="#cfd8d3">createServer</tspan><tspan fill="#8f9c96"> } </tspan><tspan fill="#f81578">from</tspan><tspan fill="#fcc60b"> 'node:http'</tspan><tspan fill="#8f9c96">;</tspan></text>
  <text xml:space="preserve" x="30" y="109"><tspan fill="#f81578">const</tspan><tspan fill="#cfd8d3"> port </tspan><tspan fill="#8f9c96">= </tspan><tspan fill="#cfd8d3">process</tspan><tspan fill="#8f9c96">.</tspan><tspan fill="#0690fc">env</tspan><tspan fill="#8f9c96">.</tspan><tspan fill="#0690fc">PORT</tspan><tspan fill="#8f9c96"> ?? </tspan><tspan fill="#c312f9">3000</tspan><tspan fill="#8f9c96">;</tspan></text>
  <text xml:space="preserve" x="30" y="130"><tspan fill="#f81578">const</tspan><tspan fill="#cfd8d3"> routes </tspan><tspan fill="#8f9c96">= </tspan><tspan fill="#f81578">new</tspan><tspan fill="#8f9c96"> </tspan><tspan fill="#45fdf3">Map</tspan><tspan fill="#8f9c96">([</tspan></text>
  <text xml:space="preserve" x="30" y="151"><tspan fill="#8f9c96">  ['</tspan><tspan fill="#fcc60b">/api/jobs</tspan><tspan fill="#8f9c96">', </tspan><tspan fill="#05f98b">listJobs</tspan><tspan fill="#8f9c96">],</tspan></text>
  <text xml:space="preserve" x="30" y="172"><tspan fill="#8f9c96">]);</tspan></text>
  <text xml:space="preserve" x="30" y="214"><tspan fill="#f81578">export</tspan><tspan fill="#8f9c96"> </tspan><tspan fill="#f81578">async</tspan><tspan fill="#8f9c96"> </tspan><tspan fill="#f81578">function</tspan><tspan fill="#8f9c96"> </tspan><tspan fill="#05f98b">start</tspan><tspan fill="#8f9c96">(</tspan><tspan fill="#cfd8d3">opts</tspan><tspan fill="#8f9c96"> = {}) {</tspan></text>
  <text xml:space="preserve" x="30" y="235"><tspan fill="#8f9c96">  </tspan><tspan fill="#f81578">return</tspan><tspan fill="#8f9c96"> </tspan><tspan fill="#05f98b">createServer</tspan><tspan fill="#8f9c96">(</tspan><tspan fill="#cfd8d3">handler</tspan><tspan fill="#8f9c96">).</tspan><tspan fill="#05f98b">listen</tspan><tspan fill="#8f9c96">(</tspan><tspan fill="#cfd8d3">port</tspan><tspan fill="#8f9c96">);</tspan></text>
  <text xml:space="preserve" x="30" y="256"><tspan fill="#8f9c96">}</tspan></text>
  <text xml:space="preserve" x="30" y="291"><tspan fill="#0690fc">~/Code/nullglow</tspan><tspan fill="#6e7d71"> on </tspan><tspan fill="#c312f9">main</tspan><tspan fill="#f81578"> [!2+1]</tspan><tspan fill="#6e7d71"> via </tspan><tspan fill="#05f98b">node v22.11.0</tspan></text>
