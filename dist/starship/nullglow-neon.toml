# Nullglow for starship. https://github.com/mahoudeau/nullglow
# Generated by build.py. Copy to ~/.config/starship.toml

"$schema" = 'https://starship.rs/config-schema.json'

palette = 'nullglow-neon'
add_newline = true

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$nodejs$bun$deno$python$rust$golang$java$ruby$php$lua$docker_context\
$cmd_duration\
$line_break\
$character"""

right_format = """$status$jobs$time"""

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vicmd_symbol = "[❮](bold yellow)"

[directory]
style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "
truncation_length = 24

[git_status]
style = "bold pink"
format = '([\[$all_status$ahead_behind\]]($style) )'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "󰏗 ${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_state]
style = "bold yellow"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[cmd_duration]
min_time = 2_000
format = "took [$duration]($style) "
style = "bold yellow"

[status]
disabled = false
style = "bold red"
symbol = "✘ "
format = '[$symbol$status]($style) '
map_symbol = true

[jobs]
symbol = " "
style = "bold blue"
number_threshold = 1
format = "[$symbol$number]($style) "

[time]
disabled = false
format = "[$time]($style)"
time_format = "%R"
style = "comment"

[nodejs]
symbol = " "
style = "green"
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
style = "yellow"
format = 'via [${symbol}(${version} )(\($virtualenv\) )]($style)'

[rust]
symbol = " "
style = "pink"
format = "via [$symbol($version )]($style)"

[golang]
symbol = " "
style = "cyan"
format = "via [$symbol($version )]($style)"

[package]
disabled = true

# Palette. Every value clears WCAG AA against the ground.
[palettes.nullglow-neon]
ground  = "#060b09"
surface = "#0e1512"
line    = "#1c2723"
fg      = "#cfd8d3"
fg_dim  = "#8f9c96"
comment = "#6e7d71"
green   = "#05f98b"
pink    = "#f81578"
cyan    = "#45fdf3"
blue    = "#0690fc"
purple  = "#c312f9"
yellow  = "#fcc60b"
red     = "#fe1115"
