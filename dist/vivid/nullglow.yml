# Nullglow for vivid -> LS_COLORS
# Generated by build.py.
#   vivid generate nullglow.yml   (or drop into ~/.config/vivid/themes/)

colors:
  ground:  '060b09'
  fg:      'cfd8d3'
  dim:     '6e7d71'
  green:   '2bf59b'
  pink:    'ff4d9e'
  cyan:    '5ce6e0'
  blue:    '48b8f5'
  purple:  'd79bff'
  yellow:  'f5d76b'
  red:     'ff5c5c'

core:
  normal_text: {}
  regular_file: {}
  reset_to_normal: {}

  directory:
    foreground: blue
    font-style: bold

  symlink:
    foreground: cyan

  multi_hard_link: {}

  fifo:
    foreground: ground
    background: cyan

  socket:
    foreground: ground
    background: pink

  door:
    foreground: ground
    background: pink

  block_device:
    foreground: cyan
    background: dim

  character_device:
    foreground: pink
    background: dim

  broken_symlink:
    foreground: ground
    background: red

  missing_symlink_target:
    foreground: ground
    background: red

  setuid: {}
  setgid: {}
  file_with_capability: {}
  sticky_other_writable: {}
  other_writable: {}
  sticky: {}

  executable_file:
    foreground: green
    font-style: bold

text:
  special:
    foreground: ground
    background: yellow

  todo:
    font-style: bold

  licenses:
    foreground: dim

  configuration:
    foreground: purple

  other:
    foreground: fg

markup:
  foreground: yellow

programming:
  source:
    foreground: green

  tooling:
    foreground: purple

    continuous-integration:
      foreground: cyan

media:
  foreground: pink

office:
  foreground: yellow

archives:
  foreground: red
  font-style: underline

executable:
  foreground: green
  font-style: bold

unimportant:
  foreground: dim
